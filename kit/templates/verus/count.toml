# The configuration of the kit counter (verus-count; its README.md,
# "Configuration", in the proved-port kit's kit/count, gives every
# key). A check
# whose section is left out does not run, and with --base-rev removing
# one the base runs fails unless a [[narrowed]] line names it with a
# reason.

[crates]
# Each subdirectory with a src/ is a crate; one whose Cargo.toml says
# `publish = false` does not ship.
dir = "crates"
# A function under a `cfg` the proof run might not meet counts as
# trusted, not verified (README.md, "Verus's build"). Name the atoms
# `make verus` is sure to set (the host, the default features it keeps)
# and those Verus never sets, one atom each, as a `cfg` writes it:
# verus_sets = ['feature = "jit"', 'target_arch = "aarch64"']
# verus_never_sets = ["miri"]

[floor]
path = "verus/FLOOR"

# With --floor, README.md must hold the one Verus badge line FLOOR's
# `functions` and `lines` figures give: a change that raises FLOOR pastes
# what `verus-count --badge .` prints.
[badge]
path = "README.md"
