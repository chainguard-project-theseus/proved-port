# Lint: rustfmt, clippy -D warnings, the source rules and shellcheck. All
# block. `make lint` runs every check in a development session.
# Toolchain: the Wolfi stream {RUST_STREAM} every check file uses but
# msrv; bump them together.
version: 1

environment:
  packages: [{RUST_STREAM}, build-base, busybox]

checks:
  rustfmt:
    description: cargo fmt --all --check. Run `cargo fmt` before committing.
    trigger: [presubmit, postsubmit]
    timeout: 5m
    cmd: [cargo, fmt, --all, --check]

  clippy:
    description: >-
      cargo clippy -D warnings over every crate and target, tests included.
    trigger: [presubmit, postsubmit]
    resources: medium
    timeout: 20m
    network: &crates
      egress: [index.crates.io, static.crates.io]
    steps:
      - name: workspace
        cmd: [cargo, clippy, --locked, --workspace, --all-targets, --, -D, warnings]
      # A workspace --workspace does not reach (fuzz/ is one) gets a step
      # of its own, with its own CARGO_TARGET_DIR.
      - name: fuzz workspace
        cmd: [env, CARGO_TARGET_DIR=target/fuzz, cargo, clippy, --locked, --manifest-path, fuzz/Cargo.toml, --all-targets, --, -D, warnings]

  # The unsafe rule is the kit's (`make lint-unsafe`, whose
  # UNSAFE_CRATES the Makefile sets), so this check pins
  # theseus-proved-port as verus.yaml does (bump both together), and
  # cargo check resolves the registry. make lint-unsafe does not check
  # SAFETY: comments: the clippy check does, once {CAPI_CRATE}'s lints
  # set clippy's undocumented_unsafe_blocks to deny (the templates
  # README says where). A rule of the port's own (its own SAFETY: check,
  # a budget of unsafe blocks) is a step after `make lint-unsafe`, in a
  # script under ci/.
  source-rules:
    description: >-
      Every crate but {CAPI_CRATE} forbids unsafe code (make lint-unsafe);
      the vendored headers define every macro exactly as {LIBRARY}
      {UPSTREAM_VERSION} does (ci/header-check.sh).
    trigger: [presubmit, postsubmit]
    resources: medium
    timeout: 15m
    environment:
      packages: [{RUST_STREAM}, build-base, busybox, make, theseus-proved-port~{KIT_VERSION}, {REFERENCE_PACKAGES}]
    network: *crates
    steps:
      - name: unsafe confinement
        cmd: [make, lint-unsafe]
      - name: header constants
        cmd: [sh, ci/header-check.sh]

  shellcheck:
    description: shellcheck over every shell script git tracks (ci/shellcheck.sh).
    trigger: [presubmit, postsubmit]
    timeout: 5m
    environment:
      # Wolfi does not package shellcheck; the chainguard.dev repository
      # does. Keep the pin in step with .chainguard/ci/env/dev.yaml. git
      # lists the scripts.
      packages: [busybox, git, shellcheck~{SHELLCHECK_RELEASE}]
    cmd: [sh, ci/shellcheck.sh]
