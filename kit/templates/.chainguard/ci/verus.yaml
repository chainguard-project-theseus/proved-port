# Verus and Kani: every proof holds, every Kani harness passes, and the
# checked shares of the shipped crates stay at or above verus/FLOOR. The
# verus checks are `make verus` (verus/README.md): `cargo verus focus`
# over {VERUS_CRATES}, then the kit counter (verus-count, from the
# theseus-proved-port package) with --floor, which compares verus/FLOOR
# with the base revision's copy, so that lowering a figure needs a new
# `lowered` line, and holds each function's rlimit use to verus/RLIMIT.
# When a figure rises, and what a `lowered` line needs, is verus/FLOOR's
# header's rule. The kani checks are `make kani`: the kit's kani.sh,
# from the same package, over every harness of the crates KANI_CRATES
# names (a foreach of KANI_ONLY, KANI_HARNESS or KANI_SHARD splits them;
# kani.sh's header says how). The two share nothing, so they are
# separate checks that run at once.
#
# Every run compares with a base, and none skips it, and both checks take
# the one Checks sets (CHAINGUARD_BASE_REVISION). On a pull request,
# verus takes the pull request's base. On main, verus-main takes the
# start of the push the run covers: Checks settles a burst of pushes into
# one run at the last, and names as its base the tip its previous run
# planned (when that is a first-parent ancestor, else the first parent).
# HEAD^ would be the merge before the last one, and a merge inside the
# burst would never be compared with main before it. Where
# verus/FLOOR exists, `make verus` passes `--base-rev "$(VERUS_BASE)"` to
# the counter and fails when VERUS_BASE is empty; it never prints SKIP and
# passes, since a run that skips the comparison lets FLOOR fall on main
# unseen.
#
# Shape: one architecture, arm64, on large-arm64 (8 vCPU, 32 GiB), with a
# 60-minute timeout for verus and 30 minutes for kani. Verus's result
# does not depend on the guest's architecture unless the proved code
# does, so one is the default. A port whose proved code differs by
# target (`cfg(target_arch)`, pointer width, page size) runs the proofs
# on both, as challoc does: uncomment verus-amd64 below. A port whose
# proofs outgrow the timeout moves up a class (pcre3: xlarge-arm64) and
# says why here.
#
# Every check here is in the port from its first commit: Checks refuses
# a change that deselects a check its run selects, so the set only grows
# (kit/templates/README.md, "The required Verus check set"). verus and
# verus-main pass at FLOOR 0.0 before the first proof. `make kani` fails
# when it finds no harness to run, so until the first harness the
# port's Makefile sets `KANI_NONE = yes`, under which it passes with
# none and fails with any; the first harness deletes that line. A port
# that will never discharge a seam with Kani leaves Kani out from its
# first commit: no kani or kani-main, no `kani~{KANI_RELEASE}` in the
# packages here or in .chainguard/ci/env/dev.yaml, and no Kani in the
# toolchain entry of .chainguard/deps.yaml.
#
# verus is pinned to the release the workspace's vstd pin names
# (Cargo.toml; bump both together, and .chainguard/ci/env/dev.yaml's),
# and it brings the rust stream and z3 that release runs with. kani is
# pinned to the release the Kani records under verus/seams/ name, built
# against the same rust stream. theseus-proved-port is pinned to the kit
# release the Makefile's PROVED_PORT_VERSION names (bump both together,
# and .chainguard/ci/env/dev.yaml's). git reads the base revision's
# verus/FLOOR.
# VERUS_THREADS gives Verus every vCPU of the guest (CG_CPUS), one z3
# per module.
# kit: proved-port v{KIT_VERSION} ({KIT_SHA})
version: 1

environment:
  packages: [verus~{VERUS_RELEASE}, kani~{KANI_RELEASE}, theseus-proved-port~{KIT_VERSION}, build-base, busybox, make, git]

checks:
  verus:
    description: >-
      make verus: cargo verus focus over {VERUS_CRATES}, then the kit
      counter's coverage floor (verus/FLOOR) and rlimit headroom
      (verus/RLIMIT), against the pull request's base.
    trigger: [presubmit]
    resources: large-arm64
    timeout: 60m
    network: &crates
      egress: [index.crates.io, static.crates.io]
    steps: &verus-steps
      - name: proofs and coverage floor
        cmd:
          - sh
          - -c
          # Checks sets the base on every run, a pull request's and
          # main's (CHAINGUARD_BASE_REVISION, a reserved variable); a run
          # without one fails rather than skip the comparison. verus-main
          # runs these same steps.
          - make verus VERUS_THREADS="${CG_CPUS:-}" VERUS_BASE="${CHAINGUARD_BASE_REVISION:?no base revision to compare verus/FLOOR with}"

  # The multi-architecture variant: the same steps on amd64, beside verus.
  # verus-main stays on one architecture.
  #
  # verus-amd64:
  #   description: >-
  #     make verus on amd64: the same steps as verus, for proved code that
  #     differs by target.
  #   trigger: [presubmit]
  #   resources: large-amd64
  #   timeout: 60m
  #   network: *crates
  #   steps: *verus-steps

  kani:
    description: "make kani: the Kani harnesses of {VERUS_CRATES}."
    trigger: [presubmit]
    resources: large-arm64
    timeout: 30m
    network: *crates
    cmd: &kani [make, kani]

  # On main, the base is the start of the push the run covers, which
  # Checks sets as for a pull request; the counter fails when it does not
  # resolve. This check must fail, never SKIP, when it has no base to
  # compare verus/FLOOR with.
  verus-main:
    description: >-
      make verus on main: the proofs, the coverage floor and rlimit
      headroom, against main before the push this run covers.
    trigger: [postsubmit]
    resources: large-arm64
    timeout: 60m
    network: *crates
    steps: *verus-steps

  kani-main:
    description: "make kani on main: the Kani harnesses."
    trigger: [postsubmit]
    resources: large-arm64
    timeout: 30m
    network: *crates
    cmd: *kani
