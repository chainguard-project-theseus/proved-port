# Checks code reviewers for {PORT}. Read from the default branch by the
# Chainguard Checks code reviewer, so a change here takes effect once it
# merges. The reviewer named here is the `bot:{PORT}` owner of every path
# in .github/codeowners.yaml (CONTRIBUTING.md, "Code review").
# kit: proved-port kit/v{KIT_VERSION}
version: 1
# Checks submits the approving review once every changed path has its
# approval (root file only).
approve: true
# Per-pass read limits, at their ceilings: a proof pull request can move a
# whole file inside `verus!`, so each pass may read the diff and its
# context. No `diff_lines`: the reviewer accepts and ignores it.
limits:
  read_calls: 60
  read_kib: 800
reviewers:
  - name: {PORT}
    trigger:
      paths: ["**"]
    prompt_file: review-prompt.md
    # {CI_RULE}: this key follows review-prompt.md's {CI_RULE} choice.
    # With the Results half, keep the key and delete these four lines. With
    # Ignore CI, delete the rest of this file: a reviewer that may not call
    # `list_checks` reads nothing new on a pass run again at the same head.
    # Run again at the same head once the presubmit aggregate finishes, so
    # a verdict that waited on CI (verus, kani) reads the results.
    rerun_on_checks: ["Chainguard Checks (presubmit)"]
