# The kit's Go checks. PLAN.md (2026-11-08) writes the kit's stats tool
# (step 6) and codegen comparer (step 7) in Go; their vet and test
# checks go here, in this file's environment. Toolchain: the newest
# Wolfi go-1.NN stream, pinned by stream as count.yaml pins rust-1.NN;
# the go-toolchain entry of .chainguard/deps.yaml moves it here and in
# .chainguard/develop.yaml together. GOTOOLCHAIN=local keeps go from
# fetching another toolchain a go.mod asks for. binutils puts c++filt
# on PATH, so fncmp-test runs the comparer's demangled rename key, the
# path a port's codegen checks take. apk-tools and
# wolfi-keys let the deps agent's guest, which runs in this
# environment, install a new stream and read Wolfi's index.
# codegen-test also builds a fixture library, so its own environment
# adds count.yaml's rust-1.NN stream and build-base: the go-toolchain
# entry moves its go stream with this file's, and the toolchain entry
# its rust stream with count.yaml's.
version: 1

environment:
  packages: [go-1.27, busybox, git, apk-tools, wolfi-keys, binutils]

checks:
  go-toolchain:
    description: >-
      The Go toolchain is the stream this file's environment names
      (go env GOVERSION), and .chainguard/develop.yaml installs the same
      stream.
    trigger: [presubmit, postsubmit]
    timeout: 5m
    cmd:
      - sh
      - -c
      - >-
        export GOTOOLCHAIN=local;
        s=$(sed -n 's/^  packages: \[\(go-1\.[0-9]*\),.*/\1/p' .chainguard/ci/go.yaml);
        v=$(go env GOVERSION);
        echo "go.yaml: $s; go env GOVERSION: $v";
        [ -n "$s" ] || { echo "FAIL: go.yaml names no go-1.NN stream first in its packages"; exit 1; };
        case $v in "go${s#go-}" | "go${s#go-}".*) ;; *) echo "FAIL: $v is not $s"; exit 1 ;; esac;
        grep -qx "    - $s" .chainguard/develop.yaml || { echo "FAIL: .chainguard/develop.yaml does not install $s"; exit 1; };
        echo PASS

  fncmp-test:
    description: >-
      kit/perf/codegen/fncmp, the codegen comparer (PLAN step 7, the Go
      port of challoc's scripts/codegen-fncmp.py): gofmt lists no file,
      go vet passes, and go test passes (challoc's 16 fixture cases,
      each report compared whole with the Python's, the immediate mask,
      Python's UTF-8 replacement decoding, and difflib's ratio and
      unified diff). FNCMP_REQUIRE_CXXFILT=1 makes a missing c++filt a
      failure rather than a skip.
    trigger: [presubmit, postsubmit]
    timeout: 10m
    cmd:
      - sh
      - -c
      - >-
        export GOTOOLCHAIN=local GOFLAGS=-mod=mod FNCMP_REQUIRE_CXXFILT=1;
        cd kit/perf/codegen/fncmp;
        f=$(gofmt -l .); [ -z "$f" ] || { echo "FAIL: gofmt lists $f"; exit 1; };
        go vet ./... && go test -count=1 ./...

  stats-test:
    description: >-
      kit/perf/stats, the bench stats tool (PLAN step 6, the Go
      replacement for a port's awk medians, comparison and tallies, and
      its pull's relabel, output, counter and md5 checks): gofmt lists
      no file, go vet passes, and go test passes (its medians,
      comparisons, tallies, relabelling and findings against goldens the
      reference awk in testdata/ref wrote, hand-worked bands, comparison
      lines and findings, and the input and usage it refuses).
    trigger: [presubmit, postsubmit]
    timeout: 10m
    cmd:
      - sh
      - -c
      - >-
        export GOTOOLCHAIN=local GOFLAGS=-mod=mod;
        cd kit/perf/stats;
        f=$(gofmt -l .); [ -z "$f" ] || { echo "FAIL: gofmt lists $f"; exit 1; };
        go vet ./... && go test -count=1 ./...

  codegen-test:
    description: >-
      kit/codegen-test.sh: kit/make/codegen.sh (make codegen,
      codegen-capture and codegen-compare). Its notices on challoc's
      saved reports, base with a stand-in compare, the settings it
      refuses, and a fixture library built twice through base with fncmp
      built here: no change is .text identical, a moved table is
      reloc-only with changed 0, a changed function is changed 1 and
      exits 2, a feature's function changes one build only, and a
      missing comparer fails; a failing objcopy or sha256sum, a missing
      capture or build, an unwritten library and a failed build each
      fail with no verdict, and a --target build compares its own
      library. The fixture has no dependencies, so it
      needs no network.
    trigger: [presubmit, postsubmit]
    timeout: 15m
    environment:
      # The file's go stream, and count.yaml's rust stream with
      # build-base for the fixture's build.
      packages: [go-1.27, rust-1.99, build-base, busybox, git, binutils]
    cmd: [sh, kit/codegen-test.sh]
