# Tests of kit/make, the make targets and scripts kit/sync.sh vendors
# into a port's verus/make: kit/make-test.sh syncs them into a scratch
# port, shows with `make -n` the commands verus, kani and the other
# targets run for each port's settings, runs kani.sh with a stub cargo
# and headers.sh over the filled templates. No Verus or Kani runs.
# busybox for the tools a port's checks have, make (GNU) for the
# snippet, git for the scratch kit repository. Blocks.
version: 1

environment:
  packages: [busybox, make, git]

checks:
  make-template:
    description: >-
      kit/make-test.sh: proved-port.mk's commands under make -n, kani.sh
      with a stub cargo (crates, a harness, shards, a failure, the fail
      pattern, no harnesses with and without KANI_NONE) and headers.sh
      over the kit's Verus files, with BusyBox's tools.
    trigger: [presubmit, postsubmit]
    timeout: 5m
    cmd: [sh, kit/make-test.sh]
