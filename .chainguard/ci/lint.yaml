# Lint of the kit's shell scripts: shellcheck (the pinned upstream
# release kit/shellcheck.sh fetches) over every kit/*.sh file git
# tracks, and kit/internal-test.sh: no file the kit ships to ports names
# anything internal. Both block.
version: 1

environment:
  packages:
    - busybox
    - curl   # kit/shellcheck.sh fetches the pinned release
    - git    # kit/shellcheck.sh lists the scripts with git ls-files
    - xz

checks:
  shellcheck:
    description: >-
      shellcheck (pinned upstream release) over every kit/*.sh file git
      tracks (kit/shellcheck.sh).
    trigger: [presubmit, postsubmit]
    timeout: 5m
    network:
      egress:
        - github.com
        # The release download redirects here.
        - release-assets.githubusercontent.com
        - objects.githubusercontent.com
    cmd: [sh, kit/shellcheck.sh]

  internal:
    description: >-
      kit/internal-test.sh: no file the kit ships to ports (kit/count,
      kit/make, kit/templates) names an internal repository, tool, URL
      or person, the kit's own repository excepted by its exact name,
      and each marker it lists is found when planted.
    trigger: [presubmit, postsubmit]
    timeout: 5m
    cmd: [sh, kit/internal-test.sh]
