# Lint of the kit's shell scripts: shellcheck (the pinned upstream
# release kit/shellcheck.sh fetches) over every kit/*.sh file git
# tracks, and kit/internal-test.sh: no file a port vendors or copies
# names anything internal. Both block.
version: 1

environment:
  packages:
    - busybox
    - curl   # kit/shellcheck.sh fetches the pinned release
    - git    # kit/shellcheck.sh lists the scripts with git ls-files
    - xz

checks:
  shellcheck:
    description: >-
      shellcheck (pinned upstream release) over every kit/*.sh file git
      tracks (kit/shellcheck.sh).
    trigger: [presubmit, postsubmit]
    timeout: 5m
    network:
      egress:
        - github.com
        # The release download redirects here.
        - release-assets.githubusercontent.com
        - objects.githubusercontent.com
    cmd: [sh, kit/shellcheck.sh]

  internal:
    description: >-
      kit/internal-test.sh: no file a port vendors (kit/count, kit/make)
      or copies (kit/templates), nor the verus/count/KIT header
      kit/sync.sh writes, names an internal repository, tool, URL or
      person, and each marker it lists is found when planted.
    trigger: [presubmit, postsubmit]
    timeout: 5m
    cmd: [sh, kit/internal-test.sh]
