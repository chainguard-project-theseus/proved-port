# The kit counter's own CI (kit/count): its tests, clippy -D warnings
# over every target, and rustfmt. The theseus-proved-port package
# installs the counter built from here, and a port runs that one without
# building or testing it, so these are the counter's tests.
# All block. Toolchain: the newest Wolfi rust stream (it carries rustc,
# cargo, rustfmt and clippy); the toolchain entry of
# .chainguard/deps.yaml moves it. git is for the tests that build a
# repository to read a base revision from. apk-tools and wolfi-keys let
# the deps agent's guest, which runs in this environment, install a new
# stream and read Wolfi's index. count-installed tests kit/make as the
# package installs it, against the counter built here. lint-unsafe-test
# and noalias-test run kit/make/lint-unsafe.sh and kit/make/noalias.sh
# with this toolchain's cargo.
version: 1

environment:
  packages: [rust-1.99, build-base, busybox, git, apk-tools, wolfi-keys]

checks:
  count-test:
    description: cargo test --locked over kit/count.
    trigger: [presubmit, postsubmit]
    timeout: 15m
    network: &crates
      egress: [index.crates.io, static.crates.io]
    cmd: [cargo, test, --locked, --manifest-path, kit/count/Cargo.toml]

  count-clippy:
    description: cargo clippy -D warnings over kit/count, tests included.
    trigger: [presubmit, postsubmit]
    timeout: 15m
    network: *crates
    cmd: [cargo, clippy, --locked, --manifest-path, kit/count/Cargo.toml, --all-targets, --, -D, warnings]

  count-rustfmt:
    description: cargo fmt --check over kit/count. Run `cargo fmt` there before committing.
    trigger: [presubmit, postsubmit]
    timeout: 5m
    cmd: [cargo, fmt, --manifest-path, kit/count/Cargo.toml, --check]

  # The check key stays because Checks refuses a change that deselects a
  # check its run selects; the vendoring script it tested is gone, so it
  # holds that it stays gone.
  count-sync:
    description: >-
      The kit ships no vendoring: kit/sync.sh and kit/sync-test.sh do not
      exist (a port takes the kit as the theseus-proved-port package).
    trigger: [presubmit, postsubmit]
    timeout: 5m
    cmd: [sh, -c, 'for f in kit/sync.sh kit/sync-test.sh; do if [ -e "$f" ]; then echo "FAIL: $f exists: the kit ships no vendoring"; exit 1; fi; done; echo PASS']

  count-installed:
    description: >-
      kit/installed-test.sh: the kit installed into a scratch root as the
      theseus-proved-port package installs it, then a fixture port
      (verus-count from PATH, no build, the PROVED_PORT_VERSION and
      counter-version guards, make verus-headers against the installed
      templates).
    trigger: [presubmit, postsubmit]
    timeout: 15m
    environment:
      # The file's packages, and make (GNU) for the port's targets.
      packages: [rust-1.99, build-base, busybox, git, make]
    network: *crates
    cmd: [sh, kit/installed-test.sh]

  lint-unsafe-test:
    description: >-
      kit/lint-unsafe-test.sh: kit/make/lint-unsafe.sh (make lint-unsafe)
      over a fixture workspace with cargo: it passes, and each planted
      change (unsafe code in a module, test, build script or example, a
      root without the forbid, half the Verus pair, a misspelt
      UNSAFE_CRATES, missing workspace lints) fails it. The fixture has
      no dependencies, so it needs no network.
    trigger: [presubmit, postsubmit]
    timeout: 10m
    cmd: [sh, kit/lint-unsafe-test.sh]

  noalias-test:
    description: >-
      kit/noalias-test.sh: kit/make/noalias.sh (make noalias) over a
      fixture library with cargo: an Unpin type's &mut self is noalias
      and fails it, a PhantomPinned one passes, and two builds, several
      codegen units, a rerun, a type at the crate root, a type with only
      &self and a wrong crate name give the verdicts they must. The
      fixture has no dependencies, so it needs no network.
    trigger: [presubmit, postsubmit]
    timeout: 10m
    cmd: [sh, kit/noalias-test.sh]
