# The kit counter's own CI (kit/count): its tests, clippy -D warnings
# over every target, and rustfmt. The theseus-proved-port package
# installs the counter built from here, and a port runs that one without
# building or testing it, so these are the counter's tests.
# All block. Toolchain: the Wolfi rust stream pcre3's test.yaml uses (it
# carries rustc, cargo, rustfmt and clippy); bump with it. git is for
# the tests that build a repository to read a base revision from.
# count-installed tests kit/make as the package installs it, against
# the counter built here.
version: 1

environment:
  packages: [rust-1.99, build-base, busybox, git]

checks:
  count-test:
    description: cargo test --locked over kit/count.
    trigger: [presubmit, postsubmit]
    timeout: 15m
    network: &crates
      egress: [index.crates.io, static.crates.io]
    cmd: [cargo, test, --locked, --manifest-path, kit/count/Cargo.toml]

  count-clippy:
    description: cargo clippy -D warnings over kit/count, tests included.
    trigger: [presubmit, postsubmit]
    timeout: 15m
    network: *crates
    cmd: [cargo, clippy, --locked, --manifest-path, kit/count/Cargo.toml, --all-targets, --, -D, warnings]

  count-rustfmt:
    description: cargo fmt --check over kit/count. Run `cargo fmt` there before committing.
    trigger: [presubmit, postsubmit]
    timeout: 5m
    cmd: [cargo, fmt, --manifest-path, kit/count/Cargo.toml, --check]

  # The check key stays because Checks refuses a change that deselects a
  # check its run selects; the vendoring script it tested is gone, so it
  # holds that it stays gone.
  count-sync:
    description: >-
      The kit ships no vendoring: kit/sync.sh and kit/sync-test.sh do not
      exist (a port takes the kit as the theseus-proved-port package).
    trigger: [presubmit, postsubmit]
    timeout: 5m
    cmd: [sh, -c, 'for f in kit/sync.sh kit/sync-test.sh; do if [ -e "$f" ]; then echo "FAIL: $f exists: the kit ships no vendoring"; exit 1; fi; done; echo PASS']

  count-installed:
    description: >-
      kit/installed-test.sh: the kit installed into a scratch root as the
      theseus-proved-port package installs it, then a fixture port
      (verus-count from PATH, no build, the PROVED_PORT_VERSION and
      counter-version guards, make verus-headers against the installed
      templates).
    trigger: [presubmit, postsubmit]
    timeout: 15m
    environment:
      # The file's packages, and make (GNU) for the port's targets.
      packages: [rust-1.99, build-base, busybox, git, make]
    network: *crates
    cmd: [sh, kit/installed-test.sh]
